<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="title">
  <title id="title">Thanks for stopping by</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5B21B6"/><stop offset=".55" stop-color="#7C3AED"/><stop offset="1" stop-color="#C084FC"/></linearGradient>
    <clipPath id="win"><rect width="1200" height="150" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#win)">
  <rect width="1200" height="150" fill="#1A1726"/>
  <rect width="1200" height="3" fill="url(#accent)"/>
  <g font-family="'JetBrains Mono', 'Fira Code', Consolas, Menlo, monospace" font-size="15" xml:space="preserve">
    <text x="40" y="48"><tspan fill="#9FE6C3">gamze@dev</tspan><tspan fill="#BFB8D6"> ~ $ </tspan><tspan fill="#F4F1FA">git commit -m </tspan><tspan fill="#FFCB8B">"thanks for stopping by"</tspan></text>
    <text x="40" y="78"><tspan fill="#5C5578">[main </tspan><tspan fill="#C792EA">7c3aed</tspan><tspan fill="#5C5578">] </tspan><tspan fill="#BFB8D6">1 visitor, ∞ ideas — let's build something useful</tspan><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.696;1" dur="1.15s" fill="freeze"/></text>
    <text x="40" y="108"><tspan fill="#9FE6C3">gamze@dev</tspan><tspan fill="#BFB8D6"> ~ $ </tspan><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.788;1" dur="1.65s" fill="freeze"/></text>
  </g>
  <rect x="170" y="94" width="9" height="18" fill="#9FE6C3">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  <text x="1160" y="108" text-anchor="end" fill="#5C5578" font-family="'JetBrains Mono', 'Fira Code', Consolas, Menlo, monospace" font-size="12.5">gamzesirin.com.tr</text>
  </g>
  <rect x=".5" y=".5" width="1199" height="149" rx="16" fill="none" stroke="#3A3354"/>
</svg>
